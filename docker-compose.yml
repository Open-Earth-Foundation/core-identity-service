# Local Postgres for the identity database. It listens on port 5440 so it does
# not clash with a local CityCatalyst database (5432) or other dev databases.
#
# The database name, user and password come from .env (copy env.example and fill
# them in). Any values work for local development.
#
#   docker compose up -d
#   npm run db:migrate
services:
  identity-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
    ports:
      - "${DATABASE_PORT:-5440}:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data

volumes:
  identity-db-data:
