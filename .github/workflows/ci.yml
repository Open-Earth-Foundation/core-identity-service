name: CI

# Checks on every pull request. Pushes to develop also publish the image to
# GHCR. Deployment is a separate, manual workflow (deploy-dev.yml).
permissions:
  contents: read

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

jobs:
  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Never publish an image from a build that failed its checks.
    needs: checks
    permissions:
      contents: read
      packages: write
    env:
      # Only pushes to develop publish. Pull requests and main just build.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/open-earth-foundation/core-identity-service:${{ github.sha }}
            ghcr.io/open-earth-foundation/core-identity-service:latest
